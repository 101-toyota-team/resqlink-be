main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Best for mobile apps: ensures no platform is blocked. 
# Secrets must be managed via Cloudflare Secrets or .dev.vars.
ALLOWED_ORIGINS = "*"
LOG_LEVEL = "info"

[[ratelimits]]
name = "RL_DEFAULT"
namespace_id = "1001"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "RL_DRIVER"
namespace_id = "1001"
[ratelimits.simple]
limit = 60
period = 60

[env.staging]
name = "staging"
[env.staging.vars]
ALLOWED_ORIGINS = "*"
LOG_LEVEL = "info"

[env.production]
[env.production.vars]
ALLOWED_ORIGINS = "*"
LOG_LEVEL = "info"
