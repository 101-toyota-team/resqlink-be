openapi: 3.0.1
info:
  title: ResQLink API
  description: >
    Backend API for the ResQLink ambulance booking and dispatch platform.
    Features static discovery via H3 spatial indexing and real-time driver tracking via GPS.
  version: 1.0.0
tags:
  - name: Providers
  - name: Hospitals
  - name: Ambulances
  - name: Bookings
  - name: Driver
paths:
  /:
    get:
      operationId: healthCheck
      summary: Health Check
      description: Returns a simple status text confirming the API is running.
      tags:
        - Ambulances
      responses:
        '200':
          description: API is online
          content:
            text/plain:
              schema:
                type: string
                example: 'ResQLink Robust API - Status: Online'
  /ambulances/nearby:
    get:
      operationId: findNearbyAmbulances
      summary: Find Nearby Ambulances (Discovery)
      description: >-
        **[Deprecated]** Find available ambulances near an H3 index. New
        frontends should use `GET /providers/nearby` instead. This endpoint
        remains operational for legacy compatibility.
      tags:
        - Ambulances
      parameters:
        - name: h3_index
          in: query
          required: true
          schema:
            type: string
            minLength: 15
            maxLength: 15
            pattern: ^[0-9a-f]+$
        - name: pickup
          in: query
          required: false
          description: Pickup location as "lat,lng" for distance/ETA calculation.
          schema:
            type: string
      responses:
        '200':
          description: Found ambulances
          content:
            application/json:
              schema:
                type: object
                properties:
                  center:
                    type: string
                  found_drivers:
                    type: array
                    items:
                      $ref: '#/components/schemas/AmbulanceDetails'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /hospitals/search:
    get:
      operationId: searchHospitals
      summary: Search Hospitals
      description: Search for hospitals by name or email.
      tags:
        - Hospitals
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: List of hospitals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hospital'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /hospitals/nearby:
    get:
      operationId: findNearbyHospitals
      summary: Find Nearby Hospitals
      description: Find hospitals near an H3 index.
      tags:
        - Hospitals
      parameters:
        - name: h3_index
          in: query
          required: true
          schema:
            type: string
            minLength: 15
            maxLength: 15
            pattern: ^[0-9a-f]+$
      responses:
        '200':
          description: List of nearby hospitals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HospitalDetails'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /bookings:
    post:
      operationId: createBooking
      summary: Create a Booking
      description: >-
        Create a new booking request. The user selects a provider via `GET
        /providers/nearby` and includes its `provider_id` here to lock the
        booking to that facility. If `ambulance_id` is omitted, a `draft`
        booking is created for the provider to assign an ambulance via `PUT
        /bookings/{id}/assign`.
      tags:
        - Bookings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ambulance_id:
                  type: string
                  format: uuid
                  description: >-
                    Optional. If provided, the booking is created as
                    "confirmed". Omit to create a "draft" for the provider to
                    later assign.
                provider_id:
                  type: string
                  format: uuid
                  description: >-
                    ID of the provider the user selected. Required for draft
                    bookings to lock the request to a specific facility.
                booking_type:
                  type: string
                  enum: [medis, sosial, jenazah, darurat]
                patient_condition:
                  type: string
                pickup_address:
                  type: string
                pickup_lat:
                  $ref: '#/components/schemas/Latitude'
                pickup_lng:
                  $ref: '#/components/schemas/Longitude'
                pickup_h3:
                  type: string
                  minLength: 15
                  maxLength: 15
                  pattern: ^[0-9a-f]+$
                destination_address:
                  type: string
                destination_lat:
                  $ref: '#/components/schemas/Latitude'
                destination_lng:
                  $ref: '#/components/schemas/Longitude'
              required:
                - booking_type
                - patient_condition
                - pickup_address
                - pickup_lat
                - pickup_lng
                - pickup_h3
                - destination_address
                - destination_lat
                - destination_lng
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listUserBookings
      summary: List User Bookings
      description: >-
        Retrieve all bookings for the authenticated user, with optional
        pagination.
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: List of user bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /bookings/{id}:
    get:
      operationId: getBooking
      summary: Get Booking Details
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /bookings/{id}/assign:
    put:
      operationId: assignAmbulance
      summary: Assign Ambulance to Draft Booking (Provider-side)
      description: >-
        Assign an ambulance to a draft booking, transitioning it to "confirmed"
        status. This endpoint is intended to be called by the **selected
        provider's dispatch system**, not the end-user.

        If the draft booking has a `provider_id`, the assigned ambulance
        **must** belong to that provider (`ambulances.provider_id` must match
        `bookings.provider_id`). A mismatch results in `403 Forbidden`.
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ambulance_id:
                  type: string
                  format: uuid
                driver_id:
                  type: string
                  format: uuid
              required:
                - ambulance_id
      responses:
        '200':
          description: Ambulance assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /bookings/{id}/status:
    put:
      operationId: updateBookingStatus
      summary: Update Booking Status
      description: >-
        Update the status of a booking. The `en_route` status requires provider or
        admin privileges. Once `en_route`, the driver app sends real-time GPS
        updates via `POST /driver/location`.
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [draft, confirmed, en_route, arrived, to_hospital, completed, cancelled]
              required:
                - status
      responses:
        '200':
          description: Booking status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /driver/location:
    post:
      operationId: updateDriverLocation
      summary: Submit Driver GPS Location
      description: Submit current location updates for an assigned booking.
      tags:
        - Driver
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLocation'
      responses:
        '200':
          description: Location updated successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /driver/bookings/{id}/track:
    get:
      operationId: trackDriver
      summary: Get Driver's Latest Location
      description: Get the latest location of the driver assigned to a booking.
      tags:
        - Driver
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver's latest location
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    $ref: '#/components/schemas/DriverLocation'
                    nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /driver/assignments:
    get:
      operationId: getDriverAssignments
      summary: Get Driver Assignments
      description: Retrieve current bookings assigned to the authenticated driver.
      tags:
        - Driver
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A list of assigned bookings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /driver/status:
    put:
      operationId: updateDriverStatus
      summary: Update Driver Online Status
      description: Set the driver's online status (online/offline).
      tags:
        - Driver
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                online:
                  type: boolean
              required:
                - online
      responses:
        '200':
          description: Status updated successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /providers/search:
    get:
      operationId: searchProviders
      summary: Search Providers
      deprecated: false
      description: Search for providers by name (case-insensitive).
      tags:
        - Providers
      parameters:
        - name: q
          in: query
          description: ''
          required: true
          example: RS Universitas Indonesia
          schema:
            type: string
            minLength: 2
            maxLength: 256
      responses:
        '200':
          description: A list of providers matching the query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /providers/nearby:
    get:
      operationId: findNearbyProviders
      summary: Find Nearby Providers
      deprecated: false
      description: >-
        Find providers within an expanding H3 ring search (up to ~60 km radius),
        ordered by distance ascending. Returns up to 50 results closest to the
        user.
      tags:
        - Providers
      parameters:
        - name: h3_index
          in: query
          description: >-
            H3 cell index at resolution 7 (15-character hex string). Use
            h3.latLngToCell(lat, lng, 7) to generate.
          required: true
          example: 878c10702ffffff
          schema:
            type: string
            pattern: ^[0-9a-f]+$
            minLength: 15
            maxLength: 15
        - name: lat
          in: query
          required: false
          description: User latitude (optional, falls back to H3 cell center).
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          description: User longitude (optional, falls back to H3 cell center).
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Up to 50 nearby providers sorted by distance ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderDetails'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
  /providers/{id}/bookings:
    get:
      operationId: getProviderBookings
      summary: Get Provider Bookings
      description: Retrieve bookings for a specific provider. Requires provider authentication.
      tags:
        - Providers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: The provider's UUID.
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by booking status.
          required: false
          schema:
            type: string
            enum:
              - draft
              - confirmed
              - en_route
              - arrived
              - to_hospital
              - completed
              - cancelled
        - name: limit
          in: query
          description: Max number of records to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: offset
          in: query
          description: Number of records to skip.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of bookings for the provider.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          description: Optional Zod formatting details for validation errors
          additionalProperties: true
      required:
        - error
    Coordinate:
      type: number
      format: double
    Latitude:
      allOf:
        - $ref: '#/components/schemas/Coordinate'
        - minimum: -90
          maximum: 90
    Longitude:
      allOf:
        - $ref: '#/components/schemas/Coordinate'
        - minimum: -180
          maximum: 180
    Provider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        h3_index:
          type: string
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        provider_type:
          type: string
          enum: [rumah_sakit, klinik, komunitas, rt_rw, yayasan, masjid, lainnya]
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - h3_index
        - latitude
        - longitude
        - provider_type
        - created_at
    ProviderDetails:
      allOf:
        - $ref: '#/components/schemas/Provider'
        - type: object
          properties:
            distance:
              type: string
              example: 1.2 km
            distance_value:
              type: number
              description: Distance in meters
    Hospital:
      allOf:
        - $ref: '#/components/schemas/Provider'
        - type: object
          properties:
            igd_phone:
              type: string
            igd_email:
              type: string
              nullable: true
            bed_capacity:
              type: integer
              nullable: true
            specializations:
              type: array
              items:
                type: string
              nullable: true
            accreditation:
              type: string
              nullable: true
            rating:
              type: number
            rating_count:
              type: integer
            website_url:
              type: string
              nullable: true
          required:
            - igd_phone
            - rating
            - rating_count
    HospitalDetails:
      allOf:
        - $ref: '#/components/schemas/Hospital'
        - type: object
          properties:
            distance:
              type: string
              example: 0.8 km
            distance_value:
              type: number
              description: Distance in meters
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ambulance_id:
          type: string
          format: uuid
          nullable: true
        provider_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            ID of the provider this booking is locked to. Set at creation time.
            Null for legacy bookings.
        driver_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            ID of the driver assigned to this booking. Null if unassigned.
        booking_type:
          type: string
          enum: [medis, sosial, jenazah, darurat]
        patient_condition:
          type: string
        pickup_address:
          type: string
        pickup_lat:
          $ref: '#/components/schemas/Latitude'
        pickup_lng:
          $ref: '#/components/schemas/Longitude'
        pickup_h3:
          type: string
          minLength: 15
          maxLength: 15
          pattern: ^[0-9a-f]+$
        destination_address:
          type: string
        destination_lat:
          $ref: '#/components/schemas/Latitude'
        destination_lng:
          $ref: '#/components/schemas/Longitude'
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, confirmed, en_route, arrived, to_hospital, completed, cancelled]
        estimated_price:
          type: integer
          nullable: true
        needs_paramedic:
          type: boolean
          nullable: true
        final_price:
          type: integer
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        route_geometry:
          type: object
          nullable: true
          description: >-
            Populated only after the booking is assigned an ambulance (status >= confirmed). 
            Contains the lightweight encoded polylines for UI rendering.
          properties:
            total_distance_meters:
              type: integer
            total_duration_seconds:
              type: integer
            combined_viewport:
              type: object
              properties:
                low:
                  type: object
                  properties:
                    lat:
                      $ref: '#/components/schemas/Latitude'
                    lng:
                      $ref: '#/components/schemas/Longitude'
                high:
                  type: object
                  properties:
                    lat:
                      $ref: '#/components/schemas/Latitude'
                    lng:
                      $ref: '#/components/schemas/Longitude'
            legs:
              type: array
              items:
                type: object
                properties:
                  sequence:
                    type: integer
                    description: 1 for Ambulance->Pickup, 2 for Pickup->Hospital
                  encoded_polyline:
                    type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - booking_type
        - patient_condition
        - pickup_address
        - pickup_lat
        - pickup_lng
        - pickup_h3
        - destination_address
        - destination_lat
        - destination_lng
        - user_id
        - status
        - created_at
    DriverLocation:
      type: object
      properties:
        booking_id:
          type: string
          format: uuid
        lat:
          $ref: '#/components/schemas/Latitude'
        lng:
          $ref: '#/components/schemas/Longitude'
        heading:
          type: number
        speed:
          type: number
        accuracy:
          type: number
        captured_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - lat
        - lng
    AmbulanceLocation:
      type: object
      properties:
        lat:
          $ref: '#/components/schemas/Latitude'
        lng:
          $ref: '#/components/schemas/Longitude'
        heading:
          type: number
          nullable: true
        speed:
          type: number
          nullable: true
      required:
        - lat
        - lng
    AmbulanceDetails:
      allOf:
        - $ref: '#/components/schemas/AmbulanceLocation'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            eta:
              type: string
              example: 5 mins
              nullable: true
            eta_value:
              type: number
              description: ETA in seconds
              nullable: true
            distance:
              type: string
              example: 2.5 km
              nullable: true
            distance_value:
              type: number
              description: Distance in meters
              nullable: true
          required:
            - id
  responses:
    ValidationError:
      description: Invalid payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Success:
              summary: Success
              value:
                error: Validation failed
                details: {}
    UnauthorizedError:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Success:
              summary: Success
              value:
                error: Unauthorized access
                details: {}
    ForbiddenError:
      description: Valid JWT but inadequate permissions/roles
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Success:
              summary: Success
              value:
                error: You do not have permission to access this resource
                details: {}
    NotFoundError:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Success:
              summary: Success
              value:
                error: Booking not found
