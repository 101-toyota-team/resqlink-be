name: Deploy Backend

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: STAGING
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ]; then echo "❌ SUPABASE_PROJECT_ID is missing"; exit 1; fi
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then echo "❌ SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi
          if [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then echo "❌ SUPABASE_DB_PASSWORD is missing"; exit 1; fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "❌ CLOUDFLARE_API_TOKEN is missing"; exit 1; fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then echo "❌ CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; fi
          if [ -z "${{ secrets.UPSTASH_REDIS_REST_URL }}" ]; then echo "❌ UPSTASH_REDIS_REST_URL is missing"; exit 1; fi
          if [ -z "${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" ]; then echo "❌ UPSTASH_REDIS_REST_TOKEN is missing"; exit 1; fi
          if [ -z "${{ secrets.SUPABASE_SECRET_KEY }}" ]; then echo "❌ SUPABASE_SECRET_KEY is missing"; exit 1; fi
          if [ -z "${{ secrets.MAPBOX_ACCESS_TOKEN }}" ]; then echo "❌ MAPBOX_ACCESS_TOKEN is missing"; exit 1; fi

      - name: Create .dev.vars for integration tests
        working-directory: ./backend
        run: |
          cat <<EOF > .dev.vars
          SUPABASE_URL=https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
          EOF

      - name: Verify Code Quality
        working-directory: ./backend
        run: |
          npm run lint
          npx tsc --noEmit
          npm test


      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase Migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --password ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase migration repair --status reverted 20260601090000 --password ${{ secrets.SUPABASE_DB_PASSWORD }} || true
          supabase migration repair --status applied 20260601091242 --password ${{ secrets.SUPABASE_DB_PASSWORD }} || true
          supabase db push --include-all --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push Secrets to Cloudflare Worker
        working-directory: ./backend
        run: |
          npx wrangler secret put SUPABASE_URL --env staging <<< "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co"
          npx wrangler secret put UPSTASH_REDIS_REST_URL --env staging <<< "${{ secrets.UPSTASH_REDIS_REST_URL }}"
          npx wrangler secret put UPSTASH_REDIS_REST_TOKEN --env staging <<< "${{ secrets.UPSTASH_REDIS_REST_TOKEN }}"
          npx wrangler secret put SUPABASE_SECRET_KEY --env staging <<< "${{ secrets.SUPABASE_SECRET_KEY }}"
          npx wrangler secret put MAPBOX_ACCESS_TOKEN --env staging <<< "${{ secrets.MAPBOX_ACCESS_TOKEN }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker
        working-directory: ./backend
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

