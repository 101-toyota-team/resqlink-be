name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'PRODUCTION' || 'STAGING' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Secrets
        run: |
          REQUIRED_VARS=("SUPABASE_PROJECT_ID" "SUPABASE_ACCESS_TOKEN" "SUPABASE_DB_PASSWORD" "CLOUDFLARE_API_TOKEN" "CLOUDFLARE_ACCOUNT_ID" "UPSTASH_REDIS_REST_URL" "UPSTASH_REDIS_REST_TOKEN" "SUPABASE_URL" "SUPABASE_SECRET_KEY" "MAPBOX_ACCESS_TOKEN" "ALLOWED_ORIGINS")
          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var}" ]; then
              echo "❌ $var is missing in environment"
              exit 1
            fi
          done
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}

      - name: Deploy Supabase Migrations
        run: |
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }} --password ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase db push --include-all --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Cloudflare Worker
        id: wrangler_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./backend
          environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          vars: |
            UPSTASH_REDIS_REST_URL
            SUPABASE_URL
            ALLOWED_ORIGINS
            LOG_LEVEL
          secrets: |
            UPSTASH_REDIS_REST_TOKEN
            SUPABASE_SECRET_KEY
            MAPBOX_ACCESS_TOKEN
        env:
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}

      - name: Health Check
        run: |
          URL="${{ steps.wrangler_deploy.outputs.deployment-url }}"
          echo "Verifying deployment at $URL"
          for i in {1..5}; do
            if curl -s "$URL" | grep -q "Status: Online"; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i: Health check failed, retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1
