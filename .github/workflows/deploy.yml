name: Deploy Backend

on:
  push:
    branches:
      - main
      - staging
      - dev

jobs:
  deploy:
    name: Deploy to ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: dev
            environment: DEVELOPMENT
            wrangler_env: dev
          - branch: staging
            environment: STAGING
            wrangler_env: staging
          - branch: main
            environment: PRODUCTION
            wrangler_env: production
    if: github.ref_name == matrix.branch
    environment: ${{ matrix.environment }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Secrets
        run: |
          REQUIRED_SECRETS=("SUPABASE_PROJECT_ID" "SUPABASE_ACCESS_TOKEN" "SUPABASE_DB_PASSWORD" "CLOUDFLARE_API_TOKEN" "CLOUDFLARE_ACCOUNT_ID")
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!secret}" ]; then
              echo "❌ $secret is missing in ${{ matrix.environment }} environment"
              exit 1
            fi
          done
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Supabase Migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Cloudflare Worker
        working-directory: ./backend
        run: |
          if [ "${{ matrix.wrangler_env }}" == "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env ${{ matrix.wrangler_env }}
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
