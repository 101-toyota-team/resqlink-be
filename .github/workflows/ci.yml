name: CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    # Map environment based on branch: main -> PRODUCTION, staging -> STAGING
    environment: ${{ github.ref_name == 'main' && 'PRODUCTION' || 'STAGING' }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: cd backend && npm install
      - name: Create .dev.vars for Cloudflare Worker tests
        run: |
          cat > backend/.dev.vars <<EOF
          SUPABASE_URL=https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
          EOF
      - name: Lint
        run: cd backend && npm run lint
      - name: Test
        run: cd backend && npm test
      - name: Format Check
        run: cd backend && npx prettier --check "**/*.{ts,js}"
