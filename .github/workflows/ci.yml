name: CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch: {}

jobs:
  backend-ci:
    runs-on: ${{ (github.ref_name == 'staging' || (github.event_name == 'pull_request' && github.base_ref == 'staging')) && 'self-hosted' || 'ubuntu-latest' }}
    # Map environment based on branch: main -> PRODUCTION, staging -> STAGING
    environment: ${{ github.ref_name == 'main' && 'PRODUCTION' || 'STAGING' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        working-directory: ./backend
        run: npm install
      - name: Verify Secrets
        run: |
          REQUIRED_VARS=("UPSTASH_REDIS_REST_URL" "UPSTASH_REDIS_REST_TOKEN" "SUPABASE_SECRET_KEY" "MAPBOX_ACCESS_TOKEN" "SUPABASE_URL" "ALLOWED_ORIGINS")
          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var}" ]; then
              echo "❌ $var is missing in environment"
              exit 1
            fi
          done
        env:
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
      - name: Create .dev.vars for Cloudflare Worker tests
        run: |
          cat > backend/.dev.vars <<EOF
          SUPABASE_URL=${{ vars.SUPABASE_URL }}
          UPSTASH_REDIS_REST_URL=${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
          ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
          LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
          EOF
      - name: Lint
        working-directory: ./backend
        run: npm run lint
      - name: Test
        working-directory: ./backend
        run: npm test
      - name: Format Check
        working-directory: ./backend
        run: npx prettier --check "**/*.{ts,js}"
